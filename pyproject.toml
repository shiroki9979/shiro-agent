[project]
name = "shiro-agent"
version = "0.1.0"
description = "Personal agent configurations, shared rules, and skills manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shiro-build = "scripts.build:main"
shiro-skills = "scripts.fetch_skills:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
